# Build the theme with:
#
#     docker compose run --rm build
#
# Use `run`, not `up`. `docker compose up` exits 0 even when the container
# fails, so a broken build would report success -- verified: with a missing
# asset, `up` exits 0 while `run` exits 1. If you must use `up`, pass
# --exit-code-from build.
services:
  build:
    build:
      context: .
      dockerfile_inline: |
        # syntax=docker/dockerfile:1

        # Pinned to an Alpine release, not just a Python version, so a rebuild
        # cannot silently lose qt5-qtbase when Alpine eventually drops Qt5.
        # The FROM lines write it with a doubled dollar sign because Compose
        # substitutes variables in this block itself, before BuildKit sees it.
        ARG BASE=python:3.14-alpine3.24

        # The toolchain stage is mostly weight the build never touches, so only
        # two things leave it: the rcc binary and the Python packages.
        FROM $${BASE} AS tools

        # qt5-qtbase-dev provides rcc, which packs the .qbtheme resource bundle.
        # Qt5's rcc is a bootstrapped binary linking only libstdc++, zstd and
        # zlib, so it runs on its own once copied out. It stays Qt5 on purpose:
        # a Qt6 rcc would change the bytes of every packed theme.
        # qtsass compiles the SCSS sources down to Qt-flavoured QSS. libsass has
        # no musl wheel, so it compiles from source here (a few minutes on the
        # first build, cached after). Stripping it takes 40 MB down to 3 MB.
        RUN apk add --no-cache qt5-qtbase-dev binutils build-base \
            && pip install --no-cache-dir --target /opt/pydeps \
                qtsass==0.4.0 libsass==0.23.0 \
            && rm -rf /opt/pydeps/bin \
            && strip --strip-unneeded /opt/pydeps/_sass.abi3.so

        FROM $${BASE}

        LABEL org.opencontainers.image.source="https://github.com/ehsan18t/nova-dark-qbt-theme" \
              org.opencontainers.image.description="Build toolchain for the Nova Dark qBittorrent theme" \
              org.opencontainers.image.licenses="MIT"

        # PYTHONPATH rather than site-packages, whose path names the Python
        # version and would need changing on every bump of BASE.
        ENV PYTHONUNBUFFERED=1 \
            PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH=/opt/pydeps

        RUN apk add --no-cache libstdc++ zstd-libs
        COPY --from=tools /usr/lib/qt5/bin/rcc /usr/local/bin/rcc
        COPY --from=tools /opt/pydeps /opt/pydeps

        WORKDIR /workspace

        # Nothing is COPYed in: the repo is bind-mounted at /workspace below.
        # That keeps this image a pure toolchain, so editing a build script,
        # stylesheet or icon never invalidates a layer or triggers a rebuild.
        CMD ["python", "scripts/build.py"]
    image: nova-dark-builder
    # The repo is mounted rather than copied, so the image stays a reusable
    # toolchain and source edits take effect on the next run with no rebuild.
    volumes:
      - .:/workspace
